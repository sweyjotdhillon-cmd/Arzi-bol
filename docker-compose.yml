services:
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "8788:8788"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:5173}
    networks:
      - arzibol-net
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
    depends_on:
      - worker
    networks:
      - arzibol-net
    restart: unless-stopped

networks:
  arzibol-net:
    driver: bridge
