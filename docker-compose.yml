services:
  arzi-bol:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    ports:
      - "8788:8788"
    environment:
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:8788}
    restart: unless-stopped
